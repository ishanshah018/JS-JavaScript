<!-- Write a function using ES6 to calculate and print all prime numbers between 
given two numbers passed as an argument assume that first number is smaller then 
second number  -->

<html>
<head></head>
<body>
    <script>
        const prime = (start, end) => {
        for (let num = start; num <= end; num++)              
        {
            let isPrime = true;
            if (num < 2) continue; // Skip numbers less than 2

            for (let i = 2; i <= num / 2; i++) 
            {
                if (num % i === 0) 
                {
                    isPrime = false;
                    break; // Not prime, exit the loop
                }
            }

            if (isPrime) document.write(num+"<br>"); // Print if prime
        }
};

prime(10, 50);

    </script>
</body>
</html>
