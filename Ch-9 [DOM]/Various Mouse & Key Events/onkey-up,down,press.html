<html>
<head>
    <script>
        function f1(id)
        {
            id.innerHTML="Key Down";
        }

        function f2(id)
        {
            id.innerHTML="Key Up";
        }

        function f3(e)
        {
            alert(e.keyCode);
        }
    </script>
</head>
<body onkeydown="f1(this)" onkeyup="f2(this)" onkeypress="f3(event)">
</body>
</html>
