<html>
<head>
    <script>
        function f1(id)
        {
            id.innerHTML="On Mouse Out";
        }

        function f2(id)
        {
            id.innerHTML="On Mouse Over"
        }
    </script>
</head>

<body>
    <div onmouseout="f1(this)" onmouseover="f2(this)" style="width:50%;height: 40%; background-color: cyan; border: 2px solid black;">

    </div>
</body>
</html>
