<html>
<head>
    <script>
        function fun(id)
        {
            val=document.fname.t1.value;
            if(val==""){
                alert("Enter Something");
                return false;
            }
            else{
                alert(val)
            }
        }
    </script>
</head>
<body>
    <form action="#" onsubmit="fun(this)" name="fname">
        <input type="text" name="t1"/>
        <input type="submit" value="Submit"/>
    </form>
</body>
</html>
