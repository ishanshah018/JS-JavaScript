<html>
<body>
    <script>
        var grade="A"

        switch(grade)
        {
            case "A":
                document.write("Good Job <br/>");
                break;

            case "B":
                document.write("Preety Job <br/>");
                break;
            
            case "C":
                document.write("Passed <br/>");
                break;
            
            case "D":
                document.write("Not Good <br/>");
                break;

            case "F":
                document.write("Failed <br/>");
                break;
            
            default:
                document.write("Unknown Grade <br/>")
        }
    </script>
</body>
</html>
