<html>
<head>
    <script>
        function info(first,last){
            var full;
            full=first+last
            return full
        }


        function hello(){
            var result;
            result=info("Ishan ","Shah")
            document.write(result)
        }
    </script>
</head>
<body>
    <input type="button" onclick="hello()" value="Name"/>
</body>
